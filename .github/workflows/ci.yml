name: Build and test
on:
  workflow_dispatch:
    inputs:
      refresh_support:
        description: Discover new official Minecraft releases before building
        type: boolean
        default: false
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  AR_MICROSOFT_CLIENT_ID: ${{ vars.AR_MICROSOFT_CLIENT_ID }}
jobs:
  launcher:
    needs: fabric
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - uses: actions/download-artifact@v4
        with:
          name: AR-Client-Companions
          path: src-tauri/resources
      - run: npm run bundle
      - name: Verify desktop starts without service credentials
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "src-tauri/target/release/ar-client.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "AR Client exited during startup (code $($process.ExitCode))" }
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v4
        with:
          name: AR-Client-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: inputs.refresh_support
        run: npm run companion:refresh -- --write
      - run: npm run companion:build
      - run: npm run companion:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: AR-Client-Companions
          path: src-tauri/resources/
