name: Build and test
on:
  workflow_dispatch:
    inputs:
      refresh_support:
        description: Discover new official Minecraft releases before building
        type: boolean
        default: false
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  AR_MICROSOFT_CLIENT_ID: ${{ vars.AR_MICROSOFT_CLIENT_ID }}
jobs:
  launcher:
    needs: fabric
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - uses: actions/download-artifact@v4
        with:
          name: AR-Client-Companions
          path: src-tauri/resources
      - run: npm run bundle
      - name: Verify installed desktop and bundled HUDs
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP "ar-client-installed"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed (code $($install.ExitCode))" }
          $manifest = Get-Content (Join-Path $destination "resources/companion.json") -Raw | ConvertFrom-Json
          $expected = (Get-Content "in-game/versions.json" -Raw | ConvertFrom-Json).versions.minecraft
          foreach ($version in $expected) {
            if ($version -notin $manifest.builds.minecraft) { throw "Missing HUD build for $version" }
          }
          foreach ($build in $manifest.builds) {
            $jar = Join-Path $destination "resources/companions/$($build.filename)"
            if ((Get-FileHash $jar -Algorithm SHA256).Hash -ne $build.sha256) { throw "Invalid HUD checksum for $($build.minecraft)" }
          }
          $process = Start-Process -FilePath (Join-Path $destination "ar-client.exe") -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "AR Client exited during startup (code $($process.ExitCode))" }
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v4
        with:
          name: AR-Client-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: inputs.refresh_support
        run: npm run companion:refresh -- --write
      - run: npm run companion:build
      - run: npm run companion:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: AR-Client-Companions
          path: src-tauri/resources/
