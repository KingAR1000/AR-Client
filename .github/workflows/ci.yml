name: Build and test
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  launcher:
    needs: fabric
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - uses: actions/download-artifact@v4
        with:
          name: AR-Client-Fabric-1.21.9
          path: in-game/build/libs
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: AR-Client-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - run: gradle -p in-game build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AR-Client-Fabric-1.21.9
          path: in-game/build/libs/*.jar
