name: Website checks
on:
  push:
    branches: [main, "feat/**"]
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml"]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix website test
      - run: node --check website/api/curseforge.js
      - run: node --check website/api/minecraft.js
