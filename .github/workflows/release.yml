name: Signed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag (for example v0.1.0)
        required: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - run: gradle -p in-game build --no-daemon
      - run: node scripts/prepare-companion.mjs
      - name: Validate release tag and package versions
        run: node scripts/check-release.mjs
        env:
          AR_RELEASE_TAG: ${{ inputs.tag }}
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: node scripts/release-config.mjs
        env:
          AR_UPDATER_PUBLIC_KEY: ${{ vars.AR_UPDATER_PUBLIC_KEY }}
      - uses: tauri-apps/tauri-action@v0
        env:
          AR_MICROSOFT_CLIENT_ID: ${{ vars.AR_MICROSOFT_CLIENT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: AR Client ${{ inputs.tag }}
          releaseBody: See the changelog and compatibility notes in the repository before installing.
          releaseDraft: true
          prerelease: ${{ contains(inputs.tag, '-') }}
          args: --config src-tauri/release.conf.json
