[package]
name = "ar-client"
version = "0.1.0"
edition = "2021"
authors = ["KingAR1000"]
license = "GPL-3.0-only"
[lib]
name = "ar_core"
crate-type = ["lib", "cdylib", "staticlib"]
[[bin]]
name = "ar-client"
path = "src/main.rs"
required-features = ["desktop"]
[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-updater"]
[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "multipart"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
base64 = "0.22"
url = "2"
png = "0.17"
[dev-dependencies]
tempfile = "3"
